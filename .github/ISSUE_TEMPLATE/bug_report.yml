name: Bug report
description: Report a reproducible defect in fmeca-mcp or the fmeca kernel.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. A minimal reproduction lets us fix it without
        guesswork. For security issues, use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: fmeca-mcp version
      description: Paste the output of `fmeca-mcp --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "Linux x86_64, macOS aarch64, Windows x86_64"
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: The client or orchestrator that drives the server.
      placeholder: "Claude Code, Cursor, custom client"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The minimal event log or `analyze` input that triggers the bug.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full error output if there is one.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: This is not a security vulnerability (those are reported privately).
          required: true
