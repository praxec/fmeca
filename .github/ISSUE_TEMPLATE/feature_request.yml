name: Feature request
description: Suggest a change or addition to fmeca-mcp or the fmeca kernel.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. The kernel is deterministic
        and scores never come from the caller, so proposals that keep that
        boundary intact are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like fmeca-mcp to do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you rejected them.
    validations:
      required: true
