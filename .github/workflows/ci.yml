name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --workspace
  test:
    needs: [test-matrix]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
  cargo-deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo doc --no-deps --locked --workspace
        env: { RUSTDOCFLAGS: "-D warnings" }
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo package --locked --list -p fmeca
      - run: cargo publish --dry-run --locked -p fmeca
      # `fmeca` 0.0.2 is not on crates.io yet, so a `fmeca-mcp` publish
      # dry-run cannot resolve it (cargo 1.99 resolves during packaging even
      # with `--no-verify`). Task 3's resolution: verify fmeca-mcp packaging
      # with `package --list`; #26 restores the full publish dry-run after
      # `fmeca` is published.
      # build.rs embeds $CARGO_MANIFEST_DIR/skills when present, and the packaged
      # crate cannot reach ../../skills, so copy the workspace skills in first
      # (the copy is gitignored).
      - name: copy skills into the fmeca-mcp package
        run: |
          if [ -d skills ]; then cp -R skills crates/fmeca-mcp/skills; fi
      - run: cargo package --locked --list -p fmeca-mcp
  npm:
    name: npm launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: launcher tests
        run: node --test npm/test/*.test.mjs
      - name: npm pack (dry run)
        working-directory: npm
        run: npm pack --dry-run --ignore-scripts
      # Runs the release publish script against a freshly packed tarball.
      - name: npm publish script (dry run)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd npm
          npm pack --ignore-scripts
          bash ../scripts/npm-publish.sh ./matthew-cochran-fmeca-*.tgz "$(node -p "require('./package.json').version")" --dry-run
  kernel-purity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: fmeca kernel has no network deps
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked -p fmeca -e normal)"
          if grep -E '\b(rig|reqwest)' <<<"$tree"; then
            echo "::error::fmeca kernel depends on rig/reqwest"
            exit 1
          fi
      - name: server builds without jev
        run: cargo build -p fmeca-mcp --no-default-features --locked
  # Builds the release binary for each frozen release.yml target, so a
  # dependency that breaks a target (C toolchain, cross build) fails a PR
  # rather than a release. Keep this matrix in step with release.yml's
  # `binaries` job.
  release-targets:
    name: release build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-15-intel }
          - { target: aarch64-apple-darwin,       os: macos-15 }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release -p fmeca-mcp --bin fmeca-mcp --target ${{ matrix.target }}
  skills-smoke:
    name: skills install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo build -p fmeca-mcp
      # With an empty skills/ this asserts exit 0 and idempotent output only;
      # once skills/ holds skills it asserts their files too.
      - name: skills install, rerun, uninstall
        run: scripts/skills-smoke.sh target/debug/fmeca-mcp "$RUNNER_TEMP"
