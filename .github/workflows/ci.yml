name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --workspace
  test:
    needs: [test-matrix]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
  cargo-deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo doc --no-deps --locked --workspace
        env: { RUSTDOCFLAGS: "-D warnings" }
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo package --locked --list -p fmeca
      - run: cargo publish --dry-run --locked -p fmeca
      # `fmeca` 0.0.2 is not on crates.io yet, so a `fmeca-mcp` publish
      # dry-run cannot resolve it (cargo 1.99 resolves during packaging even
      # with `--no-verify`). Task 3's resolution: verify fmeca-mcp packaging
      # with `package --list`; #26 restores the full publish dry-run after
      # `fmeca` is published.
      - run: cargo package --locked --list -p fmeca-mcp
  npm:
    name: npm launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: launcher tests
        run: node --test npm/test/*.test.mjs
      - name: npm pack (dry run)
        working-directory: npm
        run: npm pack --dry-run --ignore-scripts
      # Runs the release publish script against a freshly packed tarball.
      - name: npm publish script (dry run)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd npm
          npm pack --ignore-scripts
          bash ../scripts/npm-publish.sh ./matthew-cochran-fmeca-*.tgz "$(node -p "require('./package.json').version")" --dry-run
