# Dependabot configuration for praxec/fmeca.
# Weekly Cargo and GitHub Actions updates, grouped to keep PR volume low and
# targeted at the `dev` integration branch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    ignore:
      # The ref of dtolnay/rust-toolchain is the Rust version itself. It is pinned
      # to rust-toolchain.toml (1.99.0) and bumped by hand together with it.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
