[package]
name = "fmeca-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Declarative risk policies for fmeca: the policy model, TOML parsing, validation, hashing and project-policy loading. Pure: no network, no clock."
keywords = ["fmeca", "risk", "policy", "failure-modes"]
categories = ["development-tools"]

[lib]
name = "fmeca_policy"
path = "src/lib.rs"

[dependencies]
fmeca = { path = "../fmeca", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
toml = "1"
