# `confidence-view` — the maintainer's chart 2 (spec §6): the effective band is
# read from a matrix of the *standard* preset's effective band rank (rows) and
# the residual confidence (columns C4..C0).

name = "confidence-view"
description = "Effective band crossed with evidence confidence"
class = "confidence-view"
schema = 1
include_builtin_actions = true

[[bands]]
id = "none"
label = "No action"
rank = 0
dispositions = ["close", "accept"]

[[bands]]
id = "report"
label = "Report the risk"
rank = 1
dispositions = ["watch", "accept", "mitigate"]
no_action_needs_rationale = true

[[bands]]
id = "remediate"
label = "Remediate before shipping"
rank = 2
dispositions = ["mitigate", "research", "accept"]
no_action_needs_rationale = true
acceptance = "tech_lead"
review_interval = "180d"

[matrices.qualitative3x3]
derived_from = "qualitative3x3"
cells = [
  ["none",   "none",     "report"],
  ["none",   "report",   "remediate"],
  ["report", "remediate", "remediate"],
]

[matrices.nasa8004_5x5]
derived_from = "nasa8004_5x5"
cells = [
  ["none",   "none",      "none",      "report",    "report"],
  ["none",   "none",      "report",    "report",    "remediate"],
  ["none",   "report",    "report",    "remediate", "remediate"],
  ["report", "report",    "remediate", "remediate", "remediate"],
  ["report", "remediate", "remediate", "remediate", "remediate"],
]

[matrices.confidence]
derived_from = "standard-bands"
# The maintainer's chart 2. Rows: the `standard` preset's effective band
# (rank 0 none, 1 compensate, 2 review = the chart's Risk columns 1, 3, 5).
# Columns: confidence C4, C3, C2, C1, C0 (the chart's Absolute, High,
# Moderate, Slight, None).
cells = [
  ["none",   "none",      "none",      "report",    "report"],
  ["none",   "report",    "report",    "remediate", "remediate"],
  ["report", "remediate", "remediate", "remediate", "remediate"],
]

[signoff]
max_residual_band = "report"
accepted_counts_as_pass = true
accepted_requires_review_current = false
include_kernel_gate = true