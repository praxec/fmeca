# Built-in action catalog (spec §6), shared by presets that set
# `include_builtin_actions = true`. A preset's own action with the same id
# replaces the built-in one.
#
# Conditions are band-agnostic on purpose: every preset has its own band
# vocabulary, so a built-in action uses `rank_at_least` (the effective band's
# rank; rank 0 is every preset's lowest band) and the cross-preset conditions
# (domain, level, response class, disposition, single point, confidence,
# mitigation kinds, fallback, class).
#
# Gating:
# - low-cost hygiene (`secure-defaults`, `adr-for-accepted-risk`) is not gated
#   on rank;
# - every other action needs `rank_at_least = 1`, so a failure mode in the
#   lowest band gets few or no suggestions;
# - expensive actions (threat model, penetration test, chaos experiment, load
#   test, ...) need `rank_at_least = 2` and, where it fits, a domain or
#   single-point condition.

# --- eliminate ---------------------------------------------------------------

[[actions]]
id = "remove-failure-path"
text = "Remove the single point of failure by design: add redundancy or an alternative path"
tags = ["design"]
precedence = "eliminate"
applies_when = { rank_at_least = 1, single_point = true }

[[actions]]
id = "simplify-design"
text = "Simplify the design so this failure cannot be expressed (fewer states, stricter types)"
tags = ["design"]
precedence = "eliminate"
applies_when = { rank_at_least = 2, mitigation_kinds_missing = ["prevention"] }

[[actions]]
id = "design-review"
text = "Hold a design review of this failure mode with a second engineer"
tags = ["review", "design"]
precedence = "eliminate"
applies_when = { rank_at_least = 2 }

[[actions]]
id = "boundary-review"
text = "Review the component boundary and dependency direction that let this failure propagate"
tags = ["design", "review"]
precedence = "eliminate"
applies_when = { rank_at_least = 1, domain_in = ["architecture"] }

# --- prevent -----------------------------------------------------------------

[[actions]]
id = "explicit-interface-contract"
