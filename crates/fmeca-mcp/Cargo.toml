[package]
name = "fmeca-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stdio MCP server wrapping the fmeca kernel: a deterministic, offline structured-FMECA engine exposed as a command/query MCP tool surface."
keywords = ["mcp", "fmeca", "risk", "failure-modes", "analysis"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "fmeca_mcp"
path = "src/lib.rs"

[[bin]]
name = "fmeca-mcp"
path = "src/main.rs"

[features]
default = ["jev"]
jev = ["dep:rig-core", "dep:rig-typesafeai", "dep:rig-reqwest", "dep:async-trait", "dep:sha2"]

[dependencies]
fmeca = { path = "../fmeca", version = "0.0.2" }
anyhow = "1"
rmcp = { version = "1.8", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "rustls"], optional = true }
rig-typesafeai = { version = "0.44", default-features = false, features = ["reqwest", "rustls"], optional = true }
rig-reqwest = { version = "0.44", default-features = false, features = ["rustls"], optional = true }
async-trait = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }

[[example]]
name = "jev_openrouter_smoke"
required-features = ["jev"]

[dev-dependencies]
tempfile = "3"
