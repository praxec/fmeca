# Supply-chain policy for the fmeca workspace (praxec/fmeca).
#
# The license allow-list is exactly the set reported for the current tree by
# `cargo deny list -l crate`. No GPL-family license is permitted.

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # BSD-3-Clause: encoding_rs, subtle (via rig-reqwest/reqwest/rustls, jev feature).
    "BSD-3-Clause",
    # CDLA-Permissive-2.0: webpki-root-certs (via reqwest/rustls-platform-verifier, jev feature).
    "CDLA-Permissive-2.0",
    # ISC: ring, hyper-rustls, rustls, rustls-native-certs, rustls-webpki, untrusted (jev feature).
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    # Zlib: foldhash (via serde_json >= 1.0.154).
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
